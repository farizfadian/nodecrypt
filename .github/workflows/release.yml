name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No dependency cache in the release workflow (setup-node's cache-poisoning guidance).
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test

    # OIDC trusted publishing: id-token untuk OIDC, contents untuk GitHub Release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Follows setup-node's "Publishing to npm with Trusted Publisher (OIDC)" recipe:
      # Node 24, registry-url, no dependency cache, no NODE_AUTH_TOKEN.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm (OIDC butuh >= 11.5.1)
        # Pin major 11 (>= 11.5.1 for OIDC) so the publish npm does not float.
        # `npm@latest` broke the first v1.0.1 run when npm 12 dropped Node 20.
        run: npm install -g npm@11

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NodeCrypt ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🔐 NodeCrypt ${{ steps.get_version.outputs.VERSION }}
            
            Jasypt-like encryption library for Node.js.
            
            ---
            
            ### 📦 Installation
            
            ```bash
            npm install nodecrypt-jasypt@${{ steps.get_version.outputs.VERSION }}
            ```
            
            Or upgrade:
            ```bash
            npm install nodecrypt-jasypt@latest
            ```
            
            ---
            
            Made with ❤️ from Claude AI for Node.js developers who need Jasypt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
